name: Deploy Automatico su VPS Aruba

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Esecuzione Deploy via SSH su VPS Aruba
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            echo "Aggiornamento in corso sul VPS..."
            cd /root/CorrettoreAutomatico
            git pull origin main
            systemctl restart correttore.service
            echo "Deploy completato con successo!"
